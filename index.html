<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underneath Media — Car Photo & Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--mute:#6b6f76;--card:#eceef0;--red:#d3202b;--line:#e3e5e8;
--font-d:"Barlow Condensed","Arial Narrow",sans-serif;--font-b:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.logo{font:800 1.4rem var(--font-d);letter-spacing:.02em;text-decoration:none}
.logo b{color:var(--red)}
nav a{margin-left:20px;text-decoration:none;font-weight:500;color:var(--mute)}
nav a:hover{color:var(--ink)}
.hero{position:relative;margin:0 clamp(16px,4vw,48px);aspect-ratio:21/9;min-height:300px;border-radius:6px;overflow:hidden;background:#2a2d33;display:flex;align-items:flex-end;cursor:pointer}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 60%)}
.hero-text{position:relative;z-index:1;padding:clamp(18px,4vw,44px);color:#fff}
.hero h1{font:800 clamp(2.4rem,7vw,5.5rem)/.95 var(--font-d);text-transform:uppercase;max-width:14ch}
.hero p{margin-top:10px;opacity:.85}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:28px clamp(16px,4vw,48px) 8px}
.chip{border:1.5px solid var(--line);background:none;color:var(--ink);font:600 .95rem var(--font-b);padding:8px 18px;border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{margin-left:auto;color:var(--mute);font-size:.9rem}
.grid{columns:3 280px;column-gap:14px;padding:14px clamp(16px,4vw,48px) 60px}
.item{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:4px;overflow:hidden;background:var(--card);cursor:pointer;display:block;width:100%;border:0;padding:0;text-align:left;color:inherit}
.item .ph,.item img{display:block;width:100%;aspect-ratio:var(--r,3/2);object-fit:cover;transition:transform .5s}
.item:hover img,.item:hover .ph{transform:scale(1.04)}
.ph{background:linear-gradient(135deg,var(--card),var(--line))}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);font-weight:500;opacity:0;transition:opacity .25s}
.item:hover .cap,.item:focus-visible .cap{opacity:1}
.cap small{display:block;opacity:.75;font-weight:400}
.tag{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font:700 .8rem var(--font-b);padding:3px 10px;border-radius:99px}
.play{position:absolute;top:50%;left:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.play::before{content:"";border-left:16px solid var(--red);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.empty{padding:60px clamp(16px,4vw,48px);color:var(--mute)}
#pricing{padding:56px clamp(16px,4vw,48px) 20px;border-top:1px solid var(--line)}
.pr-head h2{font:800 clamp(2rem,5vw,3.4rem)/1 var(--font-d);text-transform:uppercase}
.pr-head p{margin-top:8px;color:var(--mute);max-width:60ch}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:28px}
.pk{border:1.5px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column}
.pk.hl{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk h3{font:700 1.15rem var(--font-b)}
.pk .pc{font:800 3rem/1 var(--font-d);margin-top:14px}
.pk .un{font-size:.9rem;opacity:.7;margin-top:4px}
.pk ul{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:8px;flex:1}
.pk li{padding-left:18px;position:relative}
.pk li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:2px;background:var(--red)}
.pk .btn{margin:0;text-align:center}
.pr-note{margin-top:18px;color:var(--mute);white-space:pre-line;max-width:70ch}
footer{padding:40px clamp(16px,4vw,48px) 60px;border-top:1px solid var(--line);display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}
footer h2{font:800 clamp(2rem,5vw,3.4rem)/1 var(--font-d);text-transform:uppercase}
.btn{display:inline-block;margin-top:14px;background:var(--red);color:#fff;font-weight:700;padding:12px 26px;border-radius:99px;text-decoration:none}
dialog{border:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;padding:0}
dialog::backdrop{background:rgba(8,9,11,.92)}
.lb{display:grid;place-items:center;width:100%;height:100%;padding:56px 16px 16px}
.lb img,.lb video,.lb iframe{max-width:100%;max-height:100%;border-radius:4px}
.lb iframe{width:min(1100px,100%);aspect-ratio:16/9;border:0}
.lb iframe.ig{width:min(440px,100%);height:min(88vh,780px);aspect-ratio:auto;background:#fff}
.x{position:fixed;top:14px;right:18px;z-index:2;background:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:1.3rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:600px){.hero{aspect-ratio:4/5}nav a:not(:last-child){display:none}}

/* ---- clean look + scroll motion ---- */
.hero{margin:0;border-radius:0;aspect-ratio:auto;height:clamp(420px,78vh,760px)}
.hero img{transform:scale(1.1);will-change:transform}
.hero h1{animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both}
.hero p{animation:rise 1.1s .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.chip{border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 2px;margin-right:20px;color:var(--mute)}
.chip[aria-pressed=true]{background:none;color:var(--ink);border-color:var(--ink)}
.grid{column-gap:8px}
.item{margin-bottom:8px;border-radius:0}
.tag{display:none}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.item img,.item .ph{transform:scale(1.12);transition:transform 1.5s cubic-bezier(.2,.7,.2,1)}
.item.in img,.item.in .ph{transform:scale(1)}
.item.in:hover img,.item.in:hover .ph{transform:scale(1.03);transition-duration:.6s}
@media (max-width:600px){.hero{aspect-ratio:auto;height:72vh}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.item img,.item .ph{transform:none}.hero img{transform:none}.hero h1,.hero p{animation:none}}

html{scroll-behavior:smooth}
section,footer{scroll-margin-top:64px}
footer h2{white-space:pre-line}
#about{padding:64px clamp(16px,4vw,48px);border-top:1px solid var(--line)}
.ab{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center}
.ab.noimg{grid-template-columns:minmax(0,1fr)}
.ab img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ab h2{font:800 clamp(2rem,5vw,3.4rem)/1 var(--font-d);text-transform:uppercase}
.ab .tx{margin-top:18px;white-space:pre-line;max-width:56ch}
.ab ul{list-style:none;padding:0;margin-top:22px;display:grid;gap:8px}
.ab li{padding-left:18px;position:relative}
.ab li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:2px;background:var(--red)}
@media (max-width:700px){.ab{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ---- sliders + language ---- */
nav{display:flex;align-items:center}
.lang{order:2;margin-left:20px;position:relative;display:inline-grid;grid-template-columns:1fr 1fr;width:76px;height:32px;padding:0;border:1.5px solid var(--line);border-radius:99px;background:none;cursor:pointer;font:700 .78rem var(--font-b);color:var(--mute)}
.lang span{position:relative;z-index:1;display:grid;place-items:center;transition:color .3s}
.lang::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:var(--ink);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.lang[aria-checked=true]::before{transform:translateX(100%)}
.lang[aria-checked=false] .th,.lang[aria-checked=true] .en{color:var(--bg)}
.arrows{display:flex;gap:8px;margin-left:14px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:1.3rem;line-height:1}
.arrows button:not(:disabled):hover{border-color:var(--ink)}
.arrows button:disabled{opacity:.3;cursor:default}
.grid.slider{columns:auto;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:clamp(16px,4vw,48px);scrollbar-width:none;overscroll-behavior-x:contain}
.grid::-webkit-scrollbar,.pr-grid::-webkit-scrollbar{display:none}
.grid.slider .item{flex:0 0 auto;width:auto;height:clamp(240px,58vh,520px);margin:0;scroll-snap-align:start}
.grid.slider .item img,.grid.slider .item .ph{height:100%;width:auto;aspect-ratio:var(--r,3/2);object-fit:cover}
.empty{padding:20px 0}
.pr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.pr-grid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:28px calc(-1*clamp(16px,4vw,48px)) 0;padding:0 clamp(16px,4vw,48px) 8px;scroll-padding-left:clamp(16px,4vw,48px);scrollbar-width:none;overscroll-behavior-x:contain}
.pk{flex:0 0 min(320px,84%);scroll-snap-align:start}
.more{position:absolute;left:10px;top:10px;z-index:1;background:rgba(0,0,0,.62);color:#fff;font:600 .78rem var(--font-b);padding:5px 12px;border-radius:99px;backdrop-filter:blur(4px)}
.al{display:flex;flex-direction:column;align-items:center;gap:10px;max-height:100%;min-height:0}
.al img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain}
.al figcaption{display:flex;justify-content:space-between;gap:16px;width:100%;max-width:1100px;color:#fff;font-size:.9rem;opacity:.85}
.nv{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#111;font-size:1.6rem;line-height:1;cursor:pointer;z-index:2}
.nv.p{left:16px}.nv.n{right:16px}
.logo.has-img{display:block;line-height:0}
.logo img{height:var(--lh,36px);width:auto;display:block}
.chips{display:contents}
</style>
</head>
<body>
<header>
  <a class="logo" id="logo" href="#top">UNDERNEATH.MEDIA</a>
  <nav><button class="lang" id="lang" type="button" role="switch" aria-checked="false" aria-label="ภาษา / Language"><span class="th">TH</span><span class="en">EN</span></button><a href="#work" data-t="nav_work">ผลงาน</a><a href="#pricing" data-t="nav_pricing">ราคา</a><a href="#about" id="navAbout" data-t="nav_about" hidden>เกี่ยวกับ</a><a href="#contact" data-t="nav_contact">ติดต่อ</a></nav>
</header>

<main id="top">
  <section class="hero" id="hero" tabindex="0" aria-label="ผลงานเด่น">
    <div class="hero-text">
      <h1 id="heroTitle" data-t="hero_title">Cars, caught in motion</h1>
      <p data-t="hero_subtitle">ถ่ายรูปและวิดีโอรถ · Track · Street · Event</p>
    </div>
  </section>

  <section id="work">
    <div class="bar" role="group" aria-label="กรองผลงาน">
      <span id="chips" class="chips"></span>
      <span class="count" id="count"></span>
      <span class="arrows" id="gridArrows"><button type="button" data-sl="p" data-for="grid">&#8249;</button><button type="button" data-sl="n" data-for="grid">&#8250;</button></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<section id="pricing" hidden>
  <div class="pr-head rv"><div><h2 id="prH"></h2><p id="prI"></p></div>
    <span class="arrows"><button type="button" data-sl="p" data-for="prG">&#8249;</button><button type="button" data-sl="n" data-for="prG">&#8250;</button></span></div>
  <div class="pr-grid" id="prG"></div>
  <p class="pr-note" id="prN"></p>
</section>

<section id="about" hidden>
  <div class="ab" id="abBox">
    <div class="rv"><img id="abImg" alt="" hidden></div>
    <div class="rv"><h2 id="abH"></h2><p class="tx" id="abT"></p><ul id="abL"></ul></div>
  </div>
</section>

<footer id="contact">
  <div>
    <h2 data-t="contact_heading">มีงานอยากถ่าย?<br>คุยกันได้เลย</h2>
    <a class="btn" id="igBtn" data-t="contact_button" href="https://instagram.com/underneath_media" target="_blank" rel="noopener">ทักผ่าน Instagram</a>
  </div>
</footer>

<dialog id="dlg"><button class="x" id="close" aria-label="ปิด">×</button><div class="lb" id="lb"></div></dialog>

<script>
let WORKS=[], PR={}, CATS=[], filter="all", lang="th";
try{ lang=localStorage.getItem("lang")==="en"?"en":"th"; }catch(e){}
const $ = id => document.getElementById(id);
const S = {};
const DEF = {
 th:{brand:"UNDERNEATH.MEDIA",hero_title:"Cars, caught in motion",hero_subtitle:"ถ่ายรูปและวิดีโอรถ · Track · Street · Event",nav_work:"ผลงาน",nav_pricing:"ราคา",nav_about:"เกี่ยวกับ",nav_contact:"ติดต่อ",f_all:"ทั้งหมด",f_photo:"รูปถ่าย",f_video:"วิดีโอ",f_event:"Event",count_label:"ผลงาน",about_heading:"เกี่ยวกับ",contact_heading:"มีงานอยากถ่าย?\nคุยกันได้เลย",contact_button:"ทักผ่าน Instagram",pricing_cta:"สอบถามคิวและรายละเอียด",pr_heading:"เรทราคา",empty:"ยังไม่มีผลงานในหมวดนี้",fail:"โหลดผลงานไม่สำเร็จ",novid:"ยังไม่ได้ใส่ลิงก์วิดีโอ",prev:"ก่อนหน้า",next:"ถัดไป",close:"ปิด",more:"กดเพื่อดูรูปเพิ่มเติม"},
 en:{brand:"UNDERNEATH.MEDIA",hero_title:"Cars, caught in motion",hero_subtitle:"Car photo & video · Track · Street · Event",nav_work:"Work",nav_pricing:"Pricing",nav_about:"About",nav_contact:"Contact",f_all:"All",f_photo:"Photos",f_video:"Videos",f_event:"Events",count_label:"works",about_heading:"About",contact_heading:"Got a shoot in mind?\nLet's talk",contact_button:"Message on Instagram",pricing_cta:"Ask about dates & details",pr_heading:"Pricing",empty:"No works in this category yet",fail:"Couldn't load works",novid:"No video link yet",prev:"Previous",next:"Next",close:"Close",more:"Tap to see more photos"}
};
const T  = k => (lang==="en" ? S[k+"_en"] : S[k]) || DEF[lang][k] || "";
const L  = (o,k) => (lang==="en" && o[k+"_en"]) || o[k] || "";
const LL = (o,k) => (lang==="en" && (o[k+"_en"]||[]).length) ? o[k+"_en"] : (o[k]||[]);
const IG = () => S.instagram_url || "https://instagram.com/underneath_media";
const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}),{threshold:.12,rootMargin:"0px 0px -6% 0px"}) : null;
function observe(){
  document.querySelectorAll(".rv:not(.in)").forEach((el,i)=>{
    if(!io){ el.classList.add("in"); return; }
    el.style.transitionDelay = (i%3)*90+"ms"; io.observe(el);
  });
}
const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
addEventListener("scroll",()=>{
  if(calm||scrollY>innerHeight) return;
  const im=$("hero").querySelector("img");
  if(im) im.style.transform=`translate3d(0,${scrollY*.16}px,0) scale(1.1)`;
},{passive:true});

function slide(id){
  const el=$(id), bs=document.querySelectorAll(`[data-for="${id}"]`);
  const upd=()=>{ const max=el.scrollWidth-el.clientWidth-2;
    bs.forEach(b=>{ b.disabled = b.dataset.sl==="p" ? el.scrollLeft<=2 : el.scrollLeft>=max; }); };
  if(!el._s){ el._s=1; el.addEventListener("scroll",upd,{passive:true}); addEventListener("resize",upd); }
  requestAnimationFrame(upd); setTimeout(upd,500);
}
document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{
  const el=$(b.dataset.for); el.scrollBy({left:(b.dataset.sl==="n"?1:-1)*el.clientWidth*.8,behavior:"smooth"});
});
function embed(url){
  const yt = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if (yt) return `<iframe${/shorts\//.test(url)?' class="ig"':''} src="https://www.youtube.com/embed/${yt[1]}?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
  const ig = url.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/);
  if (ig) return `<iframe class="ig" src="https://www.instagram.com/${ig[1]==="reels"?"reel":ig[1]}/${ig[2]}/embed" allowfullscreen scrolling="no"></iframe>`;
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if (vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}?autoplay=1&title=0&byline=0&portrait=0" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
  if (/\.(mp4|webm|mov)$/i.test(url)) return `<video src="${url}" controls autoplay></video>`;
  return `<p style="color:#fff">${T("novid")}</p>`;
}
function thumb(w){
  if(w.src) return w.src;
  const m=(w.video||"").match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  return m?`https://img.youtube.com/vi/${m[1]}/hqdefault.jpg`:"";
}
let alStep=null;
const imgsOf=w=>[w.src].concat(w.album||[]).filter((x,i,r)=>x&&r.indexOf(x)===i);
function album(w){
  const ims=imgsOf(w), t=L(w,"title"); let k=0;
  $("lb").innerHTML=`<figure class="al"><img alt="${t}"><figcaption><span>${t}</span><b></b></figcaption></figure>`
    +(ims.length>1?'<button class="nv p" aria-label="Previous">&#8249;</button><button class="nv n" aria-label="Next">&#8250;</button>':"");
  const im=$("lb").querySelector("img"), c=$("lb").querySelector("b");
  const go=n=>{ k=(n+ims.length)%ims.length; im.src=ims[k]; c.textContent=ims.length>1?(k+1)+" / "+ims.length:"";
    if(ims.length>1) new Image().src=ims[(k+1)%ims.length]; };
  go(0);
  if(ims.length>1){ alStep=d=>go(k+d);
    $("lb").querySelector(".p").onclick=()=>alStep(-1); $("lb").querySelector(".n").onclick=()=>alStep(1); }
}
function open(w){
  alStep=null;
  if(w.video) $("lb").innerHTML=embed(w.video);
  else if(imgsOf(w).length) album(w);
  else $("lb").innerHTML=`<p style="color:#fff">${L(w,"title")}</p>`;
  $("dlg").showModal();
}
function render(){
  const list=WORKS.filter(w=>filter==="all"||w.type===filter), g=$("grid"), slider=filter==="all";
  g.classList.toggle("slider",slider); $("gridArrows").hidden=!slider;
  $("count").textContent=list.length+" "+T("count_label");
  g.innerHTML="";
  if(!list.length){ g.innerHTML=`<p class="empty">${T("empty")}</p>`; return; }
  list.forEach(w=>{
    const b=document.createElement("button"), t=thumb(w), ti=L(w,"title"), n=imgsOf(w).length;
    b.className="item rv"; b.style.setProperty("--r", w.video?(w.src?"auto":"16/9"):(t?"auto":"3/2"));
    b.setAttribute("aria-label", ti);
    b.innerHTML=(t?`<img loading="lazy" src="${t}" alt="${ti}">`:`<div class="ph"></div>`)
      +(!w.video&&n>1?`<span class="more">${T("more")} · ${n}</span>`:"")
      +(w.video?'<span class="play"></span>':"")+`<span class="cap">${ti}<small>${L(w,"sub")}</small></span>`;
    const im=b.querySelector("img"); if(im&&slider) im.addEventListener("load",()=>slide("grid"));
    b.onclick=()=>open(w); g.appendChild(b);
  });
  observe();
  if(slider){ g.scrollLeft=0; slide("grid"); }
}
function buildPricing(){
  const p=PR.packages||[]; $("pricing").hidden=!p.length; if(!p.length) return;
  $("prH").textContent=(lang==="en"?PR.heading_en:PR.heading)||T("pr_heading");
  $("prI").textContent=L(PR,"intro"); $("prN").textContent=L(PR,"note");
  $("prG").innerHTML=p.map(k=>`<div class="pk rv${k.highlight?" hl":""}"><h3>${L(k,"name")}</h3><div class="pc">${k.price||""}</div><div class="un">${L(k,"unit")}</div><ul>${LL(k,"features").map(f=>`<li>${f}</li>`).join("")}</ul><a class="btn" href="${IG()}" target="_blank" rel="noopener">${T("pricing_cta")}</a></div>`).join("");
  $("prG").scrollLeft=0; observe(); slide("prG");
}
function applyText(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent=T(el.dataset.t); });
  const lg=$("logo"); lg.textContent="";
  if(S.logo_image){
    const im=document.createElement("img"); im.src=S.logo_image; im.alt=T("brand");
    if(S.logo_height) lg.style.setProperty("--lh",S.logo_height+"px");
    lg.classList.add("has-img"); lg.append(im);
  } else { lg.classList.remove("has-img"); lg.textContent=T("brand"); }
  $("igBtn").href=IG();
  $("lang").setAttribute("aria-checked", lang==="en");
  $("close").setAttribute("aria-label", T("close"));
  document.querySelectorAll("[data-sl]").forEach(b=>b.setAttribute("aria-label", T(b.dataset.sl==="n"?"next":"prev")));
  const at=L(S,"about_text");
  $("about").hidden=!at; $("navAbout").hidden=!at;
  if(at){
    $("abH").textContent=T("about_heading"); $("abT").textContent=at;
    $("abL").innerHTML=LL(S,"about_points").map(p=>`<li>${p}</li>`).join("");
    const has=!!S.about_image; $("abImg").parentElement.hidden=!has; $("abBox").classList.toggle("noimg",!has);
    if(has){ $("abImg").src=S.about_image; $("abImg").alt=T("about_heading"); $("abImg").hidden=false; }
    observe();
  }
}
const CAT_DEF=[{id:"photo",name:"รูปถ่าย",name_en:"Photos"},{id:"video",name:"วิดีโอ",name_en:"Videos"},{id:"event",name:"Event",name_en:"Events"}];
function catsInUse(){
  const have=new Set(WORKS.map(w=>w.type).filter(Boolean)), out=[];
  (CATS.length?CATS:CAT_DEF).forEach(c=>{ if(have.has(c.id)){ out.push(c); have.delete(c.id); } });
  have.forEach(id=>out.push({id,name:id,name_en:id}));
  return out;
}
function buildChips(){
  const bar=$("chips"), cs=catsInUse();
  if(filter!=="all" && !cs.some(c=>c.id===filter)) filter="all";
  bar.innerHTML="";
  [{id:"all",label:T("f_all")}].concat(cs.map(c=>({id:c.id,label:L(c,"name")}))).forEach(c=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.dataset.f=c.id; b.textContent=c.label;
    b.setAttribute("aria-pressed", c.id===filter);
    b.onclick=()=>{ filter=c.id; bar.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); };
    bar.appendChild(b);
  });
}
$("lang").onclick = () => {
  lang = lang==="en" ? "th" : "en";
  try{ localStorage.setItem("lang",lang); }catch(e){}
  applyText(); buildChips(); render(); buildPricing();
};
function init(){
  const feat = WORKS.find(w=>w.featured) || WORKS[0];
  if (feat){
    if (thumb(feat)) $("hero").insertAdjacentHTML("afterbegin", `<img src="${thumb(feat)}" alt="">`);
    $("hero").onclick = () => open(feat);
    $("hero").onkeydown = e => { if(e.key==="Enter") open(feat); };
  }
  buildChips(); render();
}
$("close").onclick = () => $("dlg").close();
$("dlg").addEventListener("close", () => { $("lb").innerHTML = ""; alStep=null; });
$("dlg").addEventListener("keydown", e => { if(!alStep) return; if(e.key==="ArrowRight") alStep(1); if(e.key==="ArrowLeft") alStep(-1); });
let tx0=0;
$("lb").addEventListener("touchstart", e => { tx0=e.changedTouches[0].clientX; }, {passive:true});
$("lb").addEventListener("touchend", e => { if(!alStep) return; const d=e.changedTouches[0].clientX-tx0; if(Math.abs(d)>50) alStep(d<0?1:-1); });
$("dlg").addEventListener("click", e => { if(e.target.id==="dlg"||e.target.id==="lb") $("dlg").close(); });
applyText();
const siteP = fetch("data/site.json").then(r=>r.json()).then(d=>Object.assign(S,d)).catch(()=>{}).then(()=>fetch("data/categories.json")).then(r=>r.json()).then(d=>{ CATS=d.categories||[]; }).catch(()=>{});
siteP.then(()=>{ applyText(); return fetch("data/works.json"); }).then(r=>r.json()).then(d=>{ WORKS=d.works||[]; init(); })
  .catch(()=>{ $("grid").innerHTML=`<p class="empty">${T("fail")}</p>`; });
siteP.then(()=>fetch("data/pricing.json")).then(r=>r.json()).then(d=>{ PR=d; buildPricing(); }).catch(()=>{});
</script>
</body>
</html>
