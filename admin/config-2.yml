backend:
  name: github
  repo: Babyming65/underneath_24
  branch: main

media_folder: images
public_folder: /images

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

collections:
  - name: portfolio
    label: ผลงาน
    files:
      - name: works
        label: ผลงานทั้งหมด
        file: data/works.json
        fields:
          - name: works
            label: รายการผลงาน
            label_singular: ผลงาน
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: ชื่อผลงาน, widget: string }
              - { name: title_en, label: ชื่อผลงาน (อังกฤษ), widget: string, required: false }
              - name: type
                label: หมวด
                widget: select
                options:
                  - { label: รูปถ่าย, value: photo }
                  - { label: วิดีโอ, value: video }
                  - { label: Event, value: event }
              - { name: sub, label: คำอธิบายสั้นๆ (เช่น สถานที่), widget: string, required: false }
              - { name: sub_en, label: คำอธิบายสั้นๆ (อังกฤษ), widget: string, required: false }
              - { name: src, label: รูปปก (ถ้าเป็นวิดีโอ YouTube ไม่ต้องใส่ก็ได้), widget: image, required: false }
              - { name: album, label: อัลบั้มรูปของงานนี้ (เลือกได้หลายรูปพร้อมกัน กดที่งานแล้วจะเปิดดูทั้งอัลบั้ม), widget: image, multiple: true, required: false }
              - { name: video, label: ลิงก์วิดีโอ (YouTube / Vimeo), widget: string, required: false }
              - { name: featured, label: ขึ้นเป็นภาพใหญ่หน้าแรก, widget: boolean, default: false, required: false }
      - name: pricing
        label: เรทราคา
        file: data/pricing.json
        fields:
          - { name: heading, label: หัวข้อ, widget: string, default: เรทราคา }
          - { name: heading_en, label: หัวข้อ (อังกฤษ), widget: string, required: false }
          - { name: intro, label: ข้อความอธิบายใต้หัวข้อ, widget: text, required: false }
          - { name: intro_en, label: ข้อความอธิบายใต้หัวข้อ (อังกฤษ), widget: text, required: false }
          - name: packages
            label: แพ็กเกจ
            label_singular: แพ็กเกจ
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: ชื่อแพ็กเกจ, widget: string }
              - { name: name_en, label: ชื่อแพ็กเกจ (อังกฤษ), widget: string, required: false }
              - { name: price, label: ราคา (พิมพ์เป็นข้อความได้ เช่น 3,500 หรือ สอบถาม), widget: string }
              - { name: unit, label: หน่วย (เช่น บาท / คัน), widget: string, required: false }
              - { name: unit_en, label: หน่วย (อังกฤษ), widget: string, required: false }
              - { name: features, label: รายการที่ได้รับ (กดเพิ่มทีละบรรทัด), widget: list, required: false }
              - { name: features_en, label: รายการที่ได้รับ (กดเพิ่มทีละบรรทัด) (อังกฤษ), widget: list, required: false }
              - { name: highlight, label: เน้นเป็นแพ็กเกจแนะนำ, widget: boolean, default: false, required: false }
          - { name: note, label: หมายเหตุท้ายตาราง (เช่น มัดจำ ค่าเดินทาง), widget: text, required: false }
          - { name: note_en, label: หมายเหตุท้ายตาราง (อังกฤษ), widget: text, required: false }
      - name: site
        label: ข้อความและตั้งค่าเว็บ
        file: data/site.json
        fields:
          - { name: logo_image, label: ไฟล์โลโก้ (PNG พื้นหลังโปร่งใส หรือ SVG ถ้าใส่แล้วจะใช้แทนชื่อตัวหนังสือ), widget: image, required: false }
          - { name: logo_height, label: ความสูงโลโก้ (พิกเซล ปกติ 36 ลองปรับ 28–60), widget: number, value_type: int, min: 16, max: 120, default: 36, required: false }
          - { name: brand, label: ชื่อโลโก้แบบตัวหนังสือ (ใช้เมื่อไม่มีไฟล์โลโก้), widget: string, required: false }
          - { name: brand_en, label: ชื่อโลโก้แบบตัวหนังสือ (อังกฤษ), widget: string, required: false }
          - { name: hero_title, label: หัวข้อใหญ่หน้าแรก, widget: string, required: false }
          - { name: hero_subtitle, label: ข้อความใต้หัวข้อใหญ่, widget: string, required: false }
          - { name: nav_work, label: เมนู - ผลงาน, widget: string, required: false }
          - { name: nav_pricing, label: เมนู - ราคา, widget: string, required: false }
          - { name: nav_about, label: เมนู - เกี่ยวกับ, widget: string, required: false }
          - { name: nav_contact, label: เมนู - ติดต่อ, widget: string, required: false }
          - { name: f_all, label: ปุ่มกรอง - ทั้งหมด, widget: string, required: false }
          - { name: f_photo, label: ปุ่มกรอง - รูปถ่าย, widget: string, required: false }
          - { name: f_video, label: ปุ่มกรอง - วิดีโอ, widget: string, required: false }
          - { name: f_event, label: ปุ่มกรอง - Event, widget: string, required: false }
          - { name: count_label, label: คำต่อท้ายจำนวนงาน (เช่น ผลงาน), widget: string, required: false }
          - { name: about_heading, label: เกี่ยวกับ - หัวข้อ, widget: string, required: false }
          - { name: about_text, label: เกี่ยวกับ - เนื้อหา (ถ้าเว้นว่าง ส่วนเกี่ยวกับจะไม่แสดง), widget: text, required: false }
          - { name: about_image, label: เกี่ยวกับ - รูปโปรไฟล์หรือรูปทีม, widget: image, required: false }
          - { name: about_points, label: เกี่ยวกับ - รายการสั้นๆ (กดเพิ่มทีละบรรทัด), widget: list, required: false }
          - { name: pricing_cta, label: ปุ่มในการ์ดราคา, widget: string, required: false }
          - { name: contact_heading, label: ส่วนท้าย - หัวข้อ, widget: text, required: false }
          - { name: contact_button, label: ส่วนท้าย - ข้อความปุ่ม, widget: string, required: false }
          - { name: instagram_url, label: ลิงก์ปุ่ม (Instagram หรือ LINE ก็ได้), widget: string, required: false }
          - { name: hero_title_en, label: หัวข้อใหญ่หน้าแรก (อังกฤษ), widget: string, required: false }
          - { name: hero_subtitle_en, label: ข้อความใต้หัวข้อใหญ่ (อังกฤษ), widget: string, required: false }
          - { name: nav_work_en, label: เมนู - ผลงาน (อังกฤษ), widget: string, required: false }
          - { name: nav_pricing_en, label: เมนู - ราคา (อังกฤษ), widget: string, required: false }
          - { name: nav_about_en, label: เมนู - เกี่ยวกับ (อังกฤษ), widget: string, required: false }
          - { name: nav_contact_en, label: เมนู - ติดต่อ (อังกฤษ), widget: string, required: false }
          - { name: f_all_en, label: ปุ่มกรอง - ทั้งหมด (อังกฤษ), widget: string, required: false }
          - { name: f_photo_en, label: ปุ่มกรอง - รูปถ่าย (อังกฤษ), widget: string, required: false }
          - { name: f_video_en, label: ปุ่มกรอง - วิดีโอ (อังกฤษ), widget: string, required: false }
          - { name: f_event_en, label: ปุ่มกรอง - Event (อังกฤษ), widget: string, required: false }
          - { name: count_label_en, label: คำต่อท้ายจำนวนงาน (อังกฤษ), widget: string, required: false }
          - { name: about_heading_en, label: เกี่ยวกับ - หัวข้อ (อังกฤษ), widget: string, required: false }
          - { name: about_text_en, label: เกี่ยวกับ - เนื้อหา (อังกฤษ), widget: text, required: false }
          - { name: about_points_en, label: เกี่ยวกับ - รายการสั้นๆ (อังกฤษ), widget: list, required: false }
          - { name: pricing_cta_en, label: ปุ่มในการ์ดราคา (อังกฤษ), widget: string, required: false }
          - { name: contact_heading_en, label: ส่วนท้าย - หัวข้อ (อังกฤษ), widget: text, required: false }
          - { name: contact_button_en, label: ส่วนท้าย - ข้อความปุ่ม (อังกฤษ), widget: string, required: false }
